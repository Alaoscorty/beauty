<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeautéElegante - Connexion</title>
    <link rel="shortcut icon" href="images/logo.png" type="image/x-icon" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta2/css/all.min.css"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        font-family: "Helvetica Neue", sans-serif;
        background: linear-gradient(135deg, #ffb6c1, #c084fc);
        overflow-x: hidden;
      }
      .parallax-card {
        position: absolute;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0% {
          transform: translateY(0) rotate(0);
        }
        50% {
          transform: translateY(-10px) rotate(2deg);
        }
        100% {
          transform: translateY(0) rotate(0);
        }
      }
      .card1 {
        width: 120px;
        height: 120px;
        top: 5%;
        left: 5%;
        animation-delay: 2s;
      }
      .card2 {
        width: 180px;
        height: 180px;
        bottom: 10%;
        right: 10%;
        animation-delay: 3s;
      }
      .card3 {
        width: 80px;
        height: 80px;
        top: 70%;
        left: 30%;
        animation-delay: 4s;
      }
      .card4 {
        width: 100px;
        height: 100px;
        top: 50%;
        right: 25%;
        animation-delay: 1s;
      }

      .container {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 14px 28 rgba(0, 0, 0, 0.25), 0 10px 10 rgba(0, 0, 0, 0.22);
        position: relative;
        overflow: hidden;
        width: 80%;
        max-width: 900px;
        min-height: 600px;
        margin: 80px auto;
        display: flex;
      }

      .form-container {
        position: absolute;
        top: 0;
        height: 100%;
        width: 50%;
        transition: all 0.6s ease-in-out;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 40px;
      }
      .sign-up-container {
        left: 0;
        opacity: 0;
        z-index: 1;
      }
      .sign-in-container {
        left: 0;
        z-index: 2;
      }

      .container.right-panel-active .sign-up-container {
        transform: translateX(100%);
        opacity: 1;
        z-index: 5;
      }
      .container.right-panel-active .sign-in-container {
        transform: translateX(100%);
      }

      form {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 360px;
      }
      input,
      button {
        margin: 8px 0;
        padding: 12px;
        border: none;
        border-radius: 20px;
      }
      input {
        background: #eee;
        width: 100%;
      }
      button {
        background: #ff69b4;
        color: #fff;
        font-weight: bold;
        cursor: pointer;
        transition: transform 80ms ease-in;
      }
      button.ghost {
        background: transparent;
        border: 2px solid #fff;
      }

      .social-container {
        margin: 20px 0;
      }
      .social {
        margin: 0 5px;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 50%;
        color: #ff69b4;
        text-decoration: none;
      }

      .overlay-container {
        position: absolute;
        top: 0;
        left: 50%;
        width: 50%;
        height: 100%;
        overflow: hidden;
        transition: transform 0.6s ease-in-out;
        z-index: 100;
      }
      .container.right-panel-active .overlay-container {
        transform: translateX(-100%);
      }
      .overlay {
        background: linear-gradient(to right, #d946ef, #f472b6);
        position: relative;
        left: -100%;
        width: 200%;
        height: 100%;
        transform: translateX(0);
        transition: transform 0.6s ease-in-out;
      }
      .container.right-panel-active .overlay {
        transform: translateX(50%);
      }
      .overlay-panel {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 0 40px;
        text-align: center;
        top: 0;
        height: 100%;
        width: 50%;
        transition: transform 0.6s ease-in-out;
        color: #fff;
      }
      .overlay-left {
        transform: translateX(-20%);
      }
      .container.right-panel-active .overlay-left {
        transform: translateX(0);
      }
      .overlay-right {
        right: 0;
        transform: translateX(0);
      }
      .container.right-panel-active .overlay-right {
        transform: translateX(30%);
      }

      .footer {
        text-align: center;
        margin: 20px 0;
        color: #fff;
        position: relative;
      }
      .footer .icons i {
        margin: 0 10px;
        font-size: 20px;
        color: #fff;
      }

      @media (max-width: 768px) {
        .container {
          flex-direction: column;
          width: 95%;
          min-height: auto;
          margin: 40px auto;
        }
        .form-container,
        .overlay-container {
          position: relative;
          width: 100%;
          transform: none !important;
          opacity: 1 !important;
          z-index: 2;
        }
        .overlay {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Cartes de fond animées (parallax) -->
    <div class="parallax-card card1"></div>
    <div class="parallax-card card2"></div>
    <div class="parallax-card card3"></div>
    <div class="parallax-card card4"></div>

    <!-- Conteneur principal -->
    <div class="container" id="container">
      <!-- Formulaire Inscription -->
      <div class="form-container sign-up-container">
        <form id="signUpForm">
          <h1>Créer un compte</h1>
          <div class="social-container">
            <a href="#" class="social" id="facebookBtn"
              ><i class="fab fa-facebook-f"></i
            ></a>
            <a href="#" class="social" id="googleBtn"
              ><i class="fab fa-google"></i
            ></a>
          </div>
          <span>ou utilisez votre email</span>
          <input type="text" id="nameSignUp" placeholder="Nom" required />
          <input type="email" id="emailSignUp" placeholder="Email" required />
          <input
            type="password"
            id="passwordSignUp"
            placeholder="Mot de passe"
            required
          />
          <select
            id="roleSelect"
            required
            style="margin: 8px 0; padding: 12px; border-radius: 20px"
          >
            <option value="">-- Choisir un rôle --</option>
            <option value="client">Client</option>
            <option value="pro">Professionnel</option>
          </select>

          <button type="submit">S'inscrire</button>
        </form>
      </div>

      <!-- Formulaire Connexion -->
      <div class="form-container sign-in-container">
        <form id="signInForm">
          <h1>Se connecter</h1>
          <div class="social-container">
            <a href="#" class="social" id="facebookBtn"
              ><i class="fab fa-facebook-f"></i
            ></a>
            <a href="#" class="social" id="googleBtn"
              ><i class="fab fa-google"></i
            ></a>
          </div>
          <span>ou utilisez votre compte</span>
          <input type="email" id="emailSignIn" placeholder="Email" required />
          <input
            type="password"
            id="passwordSignIn"
            placeholder="Mot de passe"
            required
          />
          <a href="#" id="resetPassword" style="margin: 10px 0"
            >Mot de passe oublié ?</a
          >
          <button type="submit">Se connecter</button>
        </form>
      </div>

      <!-- Overlay gauche/droite -->
      <div class="overlay-container">
        <div class="overlay">
          <div class="overlay-panel overlay-left">
            <h1>Ravie de te revoir !</h1>
            <p>Connecte-toi pour continuer ton voyage beauté</p>
            <button class="ghost" id="signIn">Se connecter</button>
          </div>
          <div class="overlay-panel overlay-right">
            <h1>Bienvenue !</h1>
            <p>Inscris-toi et découvre le monde de BeautéElegante</p>
            <button class="ghost" id="signUp">S'inscrire</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Pied de page -->
    <div class="footer">
      <b>Suivez-nous</b>
      <div class="icons">
        <a href="#" target="_blank"><i class="fab fa-github"></i></a>
        <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="#" target="_blank"><i class="fab fa-facebook"></i></a>
        <a href="#" target="_blank"><i class="fab fa-twitter"></i></a>
        <a href="#" target="_blank"><i class="fab fa-linkedin"></i></a>
      </div>
    </div>

    <!-- Firebase SDK -->
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
      const firebaseConfig = {
        apiKey: "AIzaSyDAgViRLvoIuOPqRyOlCEc7voEwWTuSYZQ",
        authDomain: "beaute-elangante-tml.firebaseapp.com",
        projectId: "beaute-elangante-tml",
        storageBucket: "beaute-elangante-tml.appspot.com",
        messagingSenderId: "1003880112192",
        appId: "1:1003880112192:web:c9280d57013f08f432bfa5",
      };

      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();

      const container = document.getElementById("container");
      const signUpBtn = document.getElementById("signUp");
      const signInBtn = document.getElementById("signIn");
      const signUpForm = document.getElementById("signUpForm");
      const emailSignUp = document.getElementById("emailSignUp");
      const passwordSignUp = document.getElementById("passwordSignUp");
      const roleSelect = document.getElementById("roleSelect");
      const signInForm = document.getElementById("signInForm");
      const emailSignIn = document.getElementById("emailSignIn");
      const passwordSignIn = document.getElementById("passwordSignIn");
      const resetBtn = document.getElementById("resetPassword");
      const googleBtn = document.getElementById("googleBtn");
      const facebookBtn = document.getElementById("facebookBtn");

      signUpBtn.addEventListener("click", () =>
        container.classList.add("right-panel-active")
      );
      signInBtn.addEventListener("click", () =>
        container.classList.remove("right-panel-active")
      );

      // INSCRIPTION
      signUpForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const role = roleSelect?.value || "client";
        try {
          const userCred = await auth.createUserWithEmailAndPassword(
            emailSignUp.value,
            passwordSignUp.value
          );
          const user = userCred.user;

          await user.sendEmailVerification({
            url: window.location.href, // Lien de retour si cliqué
          });

          await db.collection("users").doc(user.uid).set({
            email: user.email,
            role: role,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          });

          // Message personnalisé
          const message = `
        <div style="text-align:center;">
          <p>Inscription réussie !</p>
          <p>Un email de vérification a été envoyé à <b>${user.email}</b>.</p>
          <p>Veuillez vérifier votre boîte de réception.</p>
          <button onclick="window.open('https://mail.google.com','_blank')" style="margin-top:10px;padding:10px 20px;border:none;border-radius:5px;background-color:#ff69b4;color:white;font-weight:bold;cursor:pointer;">Vérifier l'email</button>
        </div>
      `;
          document.body.innerHTML = message;
        } catch (err) {
          alert("Erreur inscription : " + err.message);
        }
      });

      // CONNEXION
      signInForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          const userCred = await auth.signInWithEmailAndPassword(
            emailSignIn.value,
            passwordSignIn.value
          );
          const user = userCred.user;

          if (!user.emailVerified) {
            await auth.signOut();
            return alert(
              "Veuillez vérifier votre email avant de vous connecter."
            );
          }

          const doc = await db.collection("users").doc(user.uid).get();
          const role = doc.data()?.role;

          if (role === "client") {
            window.location.href = "compteuser/html/dashboard-client.html";
          } else if (role === "pro") {
            window.location.href = "compteuser/html/dashboard-pro.html";
          } else {
            alert("Rôle non défini. Contactez l’administrateur.");
          }
        } catch (err) {
          alert("Erreur connexion : " + err.message);
        }
      });

      // RÉINITIALISATION MOT DE PASSE
      resetBtn?.addEventListener("click", async () => {
        const email = prompt(
          "Entrez votre email pour réinitialiser votre mot de passe :"
        );
        if (!email) return;
        try {
          await auth.sendPasswordResetEmail(email);
          alert("Email de réinitialisation envoyé !");
        } catch (err) {
          alert("Erreur : " + err.message);
        }
      });

      // OAUTH (GOOGLE & FACEBOOK)
      const oauthLogin = async (provider) => {
        try {
          const result = await auth.signInWithPopup(provider);
          const user = result.user;

          const userRef = db.collection("users").doc(user.uid);
          const userDoc = await userRef.get();

          if (!userDoc.exists) {
            await userRef.set({
              email: user.email,
              role: "client",
              createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
          }

          const role = (await userRef.get()).data()?.role || "client";
          if (role === "client") {
            window.location.href = "compteuser/html/dashboard-client.html";
          } else {
            window.location.href = "compteuser/html/dashboard-pro.html";
          }
        } catch (err) {
          if (err.code === "auth/account-exists-with-different-credential") {
            const methods = await auth.fetchSignInMethodsForEmail(err.email);
            alert(
              `Cet email est déjà utilisé via ${methods[0]}. Veuillez vous connecter via ce mode.`
            );
          } else {
            alert("Erreur OAuth : " + err.message);
          }
        }
      };

      googleBtn?.addEventListener("click", () =>
        oauthLogin(new firebase.auth.GoogleAuthProvider())
      );
      facebookBtn?.addEventListener("click", () =>
        oauthLogin(new firebase.auth.FacebookAuthProvider())
      );

      // REDIRECTION AUTO SI CONNECTÉ
      auth.onAuthStateChanged(async (user) => {
        if (user && user.emailVerified) {
          const doc = await db.collection("users").doc(user.uid).get();
          const role = doc.data()?.role;
          if (role === "client") {
            window.location.href = "compteuser/html/dashboard-client.html";
          } else if (role === "pro") {
            window.location.href = "compteuser/html/dashboard-pro.html";
          }
        }
      });
    </script>
  </body>
</html>
